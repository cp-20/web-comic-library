<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Comic Library</title>
  </head>
  <body>
    <main>
      <h1>Web Comic Library</h1>
      <form id="pairing-form">
        <label>
          WebのURL
          <input
            id="web-origin"
            name="webOrigin"
            placeholder="https://library.example"
            required
            type="url"
          />
        </label>
        <label>pairing code <input id="pairing-code" name="pairingCode" required /></label>
        <button type="submit">連携する</button>
      </form>
      <button id="import-favorites" type="button">このサイトのお気に入りを確認する</button>
      <p aria-live="polite" id="status">Webでpairing codeを発行して連携してください。</p>
    </main>
    <script type="module" src="../src/popup.ts"></script>
  </body>
</html>
