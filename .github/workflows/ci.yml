name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_comic_library
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d web_comic_library"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ALLOW_DATABASE_INTEGRATION_TESTS: '1'
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-for-production-000
      BETTER_AUTH_URL: http://127.0.0.1:3101
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/web_comic_library
      MAGIC_LINK_DELIVERY_URL: http://127.0.0.1:3101/test-only-mail-delivery
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build:web
      - run: docker build --file Dockerfile.compatibility --tag web-comic-library-compatibility .
      - run: >-
          docker run --rm --network host
          --env ALLOW_DATABASE_INTEGRATION_TESTS
          --env BETTER_AUTH_SECRET --env BETTER_AUTH_URL
          --env DATABASE_URL
          --env MAGIC_LINK_DELIVERY_URL
          web-comic-library-compatibility
