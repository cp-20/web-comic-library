name: Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_comic_library
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d web_comic_library"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-for-production-000
      BETTER_AUTH_URL: http://127.0.0.1:3001
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/web_comic_library
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      MAGIC_LINK_DELIVERY_URL: http://127.0.0.1:3001/test-only-mail-delivery
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
      - name: Build images
        run: |
          docker build --build-arg SENTRY_DSN --target web --tag web-comic-library-web .
          docker build --target api --tag web-comic-library-api .
          docker build --target worker --tag web-comic-library-worker .
          docker build --target migration --tag web-comic-library-migration .
          docker build --target database --tag web-comic-library-database .
      - name: Check production dependencies and user
        run: >-
          docker run --rm --entrypoint sh web-comic-library-web
          -c 'test "$(id -u)" -ne 0 &&
          test ! -e /app/node_modules/typescript &&
          test ! -e /app/node_modules/playwright'
      - name: Scan container images for high and critical vulnerabilities
        run: |
          for component in web api worker database; do
            docker run --rm --network host aquasec/trivy:0.68.1 \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              "web-comic-library-${component}"
          done
      - name: Run migration read-only
        run: >-
          docker run --rm --read-only --tmpfs /tmp
          --network host --env DATABASE_URL
          web-comic-library-migration
      - name: Check backup image and missing credentials
        run: |
          docker run --rm --entrypoint wal-g web-comic-library-database --version
          docker run --rm --entrypoint test web-comic-library-database -r /etc/ssl/certs/ca-certificates.crt
          if docker run --rm --read-only --tmpfs /tmp --entrypoint logical-backup web-comic-library-database; then
            echo 'logical backup unexpectedly accepted missing credentials'
            exit 1
          fi
      - name: Start services read-only
        run: |
          docker run --detach --name web --read-only --tmpfs /tmp --network host web-comic-library-web
          docker run --detach --name api --read-only --tmpfs /tmp --network host --env BETTER_AUTH_SECRET --env BETTER_AUTH_URL --env DATABASE_URL --env MAGIC_LINK_DELIVERY_URL web-comic-library-api
          docker run --detach --name worker --read-only --tmpfs /tmp --network host --env DATABASE_URL web-comic-library-worker
      - name: Check services
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null &&
              curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null &&
              curl --fail --silent http://127.0.0.1:3001/metrics | grep -q web_comic_library_api_requests_total &&
              curl --fail --silent http://127.0.0.1:3002/metrics | grep -q web_comic_library_jobs_available &&
              docker logs worker 2>&1 | grep -q 'worker ready'; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          docker logs api
          docker logs worker
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for component in web api worker database; do
            image="ghcr.io/${GITHUB_REPOSITORY}-${component}:${IMAGE_TAG}"
            docker tag "web-comic-library-${component}" "$image"
            docker push "$image"
          done
